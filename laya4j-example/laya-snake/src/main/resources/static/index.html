<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laya Snake — 模型驱动的贪吃蛇</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --green: #3fb950; --green-dark: #238636;
    --red: #f85149; --orange: #d29922; --blue: #58a6ff; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex; justify-content: center; padding: 24px; gap: 24px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h1 span { color: var(--green); }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }

  /* ---------- 左:棋盘 ---------- */
  .board-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .board { display: grid; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  .cell { width: 26px; height: 26px; border-radius: 4px; background: #010409; position: relative; }
  .cell.body { background: var(--green-dark); border-radius: 5px; animation: pop .18s ease-out; }
  .cell.head  { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pop .18s ease-out; }
  .cell.food  { background: var(--red); border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
  .cell.risk  { outline: 2px dashed var(--red); outline-offset: -3px; }
  .cell.pick  { outline: 2px solid var(--blue); outline-offset: -3px; }
  @keyframes pop   { from { transform: scale(.4); } to { transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .stats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; }
  .stats b { color: var(--green); }
  .stats .dead { color: var(--red); font-weight: bold; }

  /* ---------- 右:决策面板 ---------- */
  .side { width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: var(--green-dark); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.toggle.on { background: var(--blue); color: #04263f; }
  input[type=number] {
    width: 90px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px; font: inherit; font-size: 13px;
  }
  label.speed { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); width: 100%; }
  input[type=range] { flex: 1; accent-color: var(--green); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; }
  .badge.model    { background: #12321c; color: var(--green); }
  .badge.fallback { background: #33270a; color: var(--orange); }
  .badge.dead     { background: #3d1214; color: var(--red); }

  .dir-row { display: grid; grid-template-columns: 54px 1fr 64px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .dir-row.chosen .dir-name { color: var(--blue); font-weight: bold; }
  .dir-row.picked  .dir-name::after { content: " ◀"; color: var(--blue); }
  .bar { height: 10px; background: #010409; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .25s ease; }
  .risk-chip { font-size: 11px; text-align: right; border-radius: 4px; padding: 2px 6px; }
  .risk-safe { background: #12321c; color: var(--green); }
  .risk-fatal { background: #3d1214; color: var(--red); }

  .trace { font-size: 12px; color: var(--dim); line-height: 1.8; word-break: break-all; max-height: 180px; overflow: auto; }
  .trace b { color: var(--text); }

  /* ---------- 决策链参数 ---------- */
  .q-card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .q-name { color: var(--purple); font-weight: bold; }
  .q-type { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #21262d; color: var(--dim); }
  .q-type.CHOICE { color: var(--blue); }
  .q-type.NOUL   { color: var(--orange); }
  .q-inst { color: var(--dim); line-height: 1.5; margin-bottom: 4px; }
  .q-opts { color: var(--dim); line-height: 1.6; }
  .q-opts b { color: var(--text); font-weight: normal; }
  .q-ans { margin-top: 4px; color: var(--green); }
  .q-ans.fatal { color: var(--red); }
  .reason { font-size: 12px; color: var(--orange); margin-top: 8px; line-height: 1.5; }
  .hist-row { display: grid; grid-template-columns: 44px 1fr 60px 54px; gap: 6px; padding: 2px 0; border-bottom: 1px dashed #21262d; font-size: 11px; }
  .hist-row .fallback { color: var(--orange); }
  .hist-row .model { color: var(--green); }
  .hist-row .dead { color: var(--red); }
</style>
</head>
<body>

<div class="board-wrap">
  <h1>Laya <span>Snake</span> — 模型驱动的贪吃蛇</h1>
  <div class="sub">每步 1 个 choice(方向)+ 4 个 noul(是否致命)· 模型决策优先,规则兜底</div>
  <div class="board" id="board"></div>
  <div class="stats">
    <span>长度 <b id="len">3</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>步数 <b id="steps">0</b></span>
    <span id="status"></span>
  </div>
</div>

<div class="side">
  <div class="panel controls-panel">
    <h2>Controls</h2>
    <div class="controls">
      <button id="btnNew">新开一局</button>
      <button id="btnStep">单步</button>
      <button id="btnAuto">自动播放</button>
      <input type="number" id="seed" value="42" placeholder="seed">
      <label class="speed">节奏 <input type="range" id="speed" min="40" max="1200" value="260" step="20"></label>
    </div>
  </div>

  <div class="panel">
    <h2>Decision <span id="modelBadge" class="badge model">mock</span>
        <span id="verdictBadge" class="badge model">—</span></h2>
    <div id="dirs"></div>
    <div class="trace" id="trace">等待第一步决策…</div>
  </div>

  <div class="panel">
    <h2>决策链参数 <span id="qCount" class="badge model">0 问</span></h2>
    <div id="chain">等待第一步决策…</div>
    <details id="stateWrap" style="margin-top:10px">
      <summary style="cursor:pointer;font-size:12px;color:var(--dim)">state 输入(JSON)</summary>
      <pre id="stateJson" class="trace" style="margin-top:6px"></pre>
    </details>
  </div>

  <div class="panel">
    <h2>决策历史</h2>
    <div class="trace" id="history" style="max-height:220px"></div>
  </div>
</div>

<script>
const DIRS = ["up", "down", "left", "right"];
let board = null, timer = null, lastSnap = null;

function el(id) { return document.getElementById(id); }

function buildBoard(size) {
  const b = el("board");
  b.innerHTML = "";
  b.style.gridTemplateColumns = `repeat(${size}, 26px)`;
  b.style.gridTemplateRows = `repeat(${size}, 26px)`;
  const cells = [];
  for (let i = 0; i < size * size; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    b.appendChild(c);
    cells.push(c);
  }
  board = { size, cells };
}

function render(snap) {
  if (!board || board.size !== snap.boardSize) buildBoard(snap.boardSize);
  board.cells.forEach(c => c.className = "cell");

  const key = (x, y) => y * board.size + x;
  const bodySet = new Map();
  (snap.bodyCells || []).forEach(([x, y]) => bodySet.set(key(x, y), true));

  if (snap.food) board.cells[key(...snap.food)].classList.add("food");

  // 蛇身(头在前):头亮绿,身体渐暗
  (snap.bodyCells || []).forEach(([x, y], i) => {
    const c = board.cells[key(x, y)];
    c.classList.add(i === 0 ? "head" : "body");
    if (i > 0) {
      const t = Math.min(i / Math.max(snap.bodyCells.length - 1, 1), 1);
      c.style.filter = `brightness(${1 - t * 0.55})`;
    }
  });

  // 决策可视化:模型选择方向(蓝框)+ 各方向致命风险(红虚线框)
  const d = snap.lastDecision;
  if (d) {
    const head = snap.bodyCells[0];
    if (head) {
      const at = (dx, dy) => {
        const x = head[0] + dx, y = head[1] + dy;
        return (x >= 0 && y >= 0 && x < board.size && y < board.size)
          ? board.cells[key(x, y)] : null;
      };
      const delta = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      if (d.choicePick) {
        const [dx, dy] = delta[d.choicePick];
        const c = at(dx, dy);
        if (c) c.classList.add("pick");
      }
      DIRS.forEach(dir => {
        if ((d.risk?.[dir] ?? 0) >= 0.5) {
          const [dx, dy] = delta[dir];
          const c = at(dx, dy);
          if (c && !c.classList.contains("food")) c.classList.add("risk");
        }
      });
    }
  }

  el("len").textContent = snap.bodyCells.length;
  el("score").textContent = snap.score;
  el("steps").textContent = snap.steps;
  el("status").innerHTML = snap.gameOver ? '<span class="dead">💀 游戏结束</span>' : "";

  if (d) renderDecision(d);
}

function renderDecision(d) {
  el("modelBadge").textContent = d.model;
  const vb = el("verdictBadge");
  if (d.gameOver) { vb.className = "badge dead"; vb.textContent = "撞死"; }
  else if (d.verdictMode === "fallback") { vb.className = "badge fallback"; vb.textContent = "规则兜底"; }
  else { vb.className = "badge model"; vb.textContent = "模型决策"; }

  const wrap = el("dirs");
  wrap.innerHTML = "";
  DIRS.forEach(dir => {
    const prob = (d.choiceProbs?.[dir] ?? 0);
    const risk = (d.risk?.[dir] ?? 0);
    const row = document.createElement("div");
    row.className = "dir-row"
      + (d.verdictDir === dir ? " chosen" : "")
      + (d.choicePick === dir ? " picked" : "");
    row.innerHTML =
      `<span class="dir-name">${dir}</span>` +
      `<span class="bar"><i style="width:${(prob * 100).toFixed(1)}%"></i></span>` +
      `<span class="risk-chip ${risk >= 0.5 ? "risk-fatal" : "risk-safe"}">` +
      `${risk >= 0.5 ? "致命" : "安全"} ${(risk).toFixed(2)}</span>`;
    wrap.appendChild(row);
  });

  el("trace").innerHTML =
    `state: <b>${d.state.length}</b> bytes · latency: <b>${d.latencyMs}ms</b><br>` +
    `模型选择: <b>${d.choicePick ?? "—"}</b> → 最终: <b>${d.verdictDir}</b>` +
    (d.ateFood ? " · 🍎 吃到食物" : "") +
    (d.gameOver ? " · 💀 撞死" : "");

  renderChain(d);
  pushHistory(d);
}

/* 决策链参数:本次向模型提出的问题清单 + 各问题的模型答案 */
function renderChain(d) {
  el("qCount").textContent = `${(d.questions || []).length} 问`;
  const wrap = el("chain");
  wrap.innerHTML = "";
  (d.questions || []).forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card";
    let optsHtml = "", ansHtml = "";
    if (q.type === "CHOICE") {
      optsHtml = Object.entries(q.options || {})
        .map(([k, v]) => `<b>${k}</b>: ${escapeHtml(v)}`)
        .join("<br>");
      const p = (d.choiceProbs?.[d.choicePick] ?? 0);
      ansHtml = `<div class="q-ans">答案: <b>${d.choicePick ?? "—"}</b> (p=${p.toFixed(3)})</div>`;
    } else if (q.type === "NOUL") {
      const dir = q.name.replace("fatal_", "");
      const r = d.risk?.[dir] ?? 0;
      const fatal = r >= 0.5;
      optsHtml = Object.entries(q.options || {})
        .map(([k, v]) => `<b>${k}</b>: ${escapeHtml(v)}`)
        .join(" · ");
      ansHtml = `<div class="q-ans ${fatal ? "fatal" : ""}">P(true)=${r.toFixed(2)} → ${fatal ? "致命" : "安全"}</div>`;
    }
    card.innerHTML =
      `<div class="q-head"><span class="q-name">${q.name}</span>` +
      `<span class="q-type ${q.type}">${q.type}</span></div>` +
      `<div class="q-inst">${escapeHtml(q.instructions)}</div>` +
      `<div class="q-opts">${optsHtml}</div>` + ansHtml;
    wrap.appendChild(card);
  });
  el("stateJson").textContent = JSON.stringify(JSON.parse(d.state), null, 2);
  el("stateWrap").open = false;
}

/* 决策历史:最近 30 步的裁决路径 */
const HISTORY = [];
function pushHistory(d) {
  HISTORY.unshift({
    pick: d.choicePick ?? "—",
    verdict: d.verdictDir,
    mode: d.gameOver ? "dead" : d.verdictMode,
    ms: d.latencyMs,
    dead: d.gameOver,
  });
  if (HISTORY.length > 30) HISTORY.pop();
  el("history").innerHTML = HISTORY.map(h =>
    `<div class="hist-row">` +
    `<span>${h.pick} → <b>${h.verdict}</b></span>` +
    `<span class="${h.mode}">${h.mode}</span>` +
    `<span>${h.ms}ms</span>` +
    `<span>${h.dead ? "💀" : ""}</span>` +
    `</div>`).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, method = "GET") {
  const r = await fetch(path, { method });
  return r.json();
}

async function step() {
  const snap = await api("/api/step", "POST");
  lastSnap = snap;
  render(snap);
  if (snap.gameOver && timer) toggleAuto(false);
}

async function newGame() {
  const seed = el("seed").value;
  const snap = await api("/api/new" + (seed ? `?seed=${seed}` : ""), "POST");
  lastSnap = snap;
  render(snap);
}

function toggleAuto(on) {
  if (timer) { clearInterval(timer); timer = null; }
  el("btnAuto").classList.toggle("on", on);
  if (on) {
    timer = setInterval(() => {
      if (lastSnap && lastSnap.gameOver) toggleAuto(false);
      else step();
    }, +el("speed").value);
  }
}

el("btnStep").onclick = step;
el("btnNew").onclick = newGame;
el("btnAuto").onclick = () => toggleAuto(!timer);
el("speed").oninput = () => { if (timer) toggleAuto(true); };

// 初始加载
api("/api/state").then(snap => { lastSnap = snap; render(snap); });
</script>
</body>
</html>
